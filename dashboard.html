<!doctype html>
<html lang="ru" data-theme="mist">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apex Capital Chart</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        min-height: 100vh;
        padding: 28px;
      }

      .dashboard-only {
        position: relative;
        z-index: 1;
        width: min(1000px, 100%);
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-strong);
        box-shadow: 0 24px 70px var(--shadow);
        overflow: hidden;
      }

      .dashboard-frame {
        display: block;
        width: 100%;
        height: 900px;
        border: 0;
        background: transparent;
      }

      @media (max-width: 760px) {
        body {
          padding: 14px;
        }

        .dashboard-frame {
          height: 1560px;
        }
      }
    </style>
  </head>
  <body>
    <canvas class="grid-landscape" aria-hidden="true"></canvas>

    <main class="dashboard-only" aria-label="Apex capital chart">
      <iframe
        class="dashboard-frame"
        src="graph/investment_capital_dashboard.html"
        title="Apex capital chart"
        loading="eager"
        scrolling="no"
      ></iframe>
    </main>

    <script src="landscape-grid.js"></script>
  </body>
</html>
